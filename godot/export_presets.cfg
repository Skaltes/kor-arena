[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt, assets/*/LISANS_CC0.txt"
exclude_filter="assets/mixamo/*.json, tests/*, tools/*"
export_path="../Arkadasima-Gonder/KorArena.exe"

[preset.0.options]

binary_format/embed_pck=true
codesign/enable=false
application/modify_resources=false

[preset.1]

name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="assets/fonts/OFL.txt, assets/*/LISANS_CC0.txt"
exclude_filter="assets/mixamo/*.json, tests/*, tools/*"
export_path="../Arkadasima-Gonder/web/index.html"

[preset.1.options]

